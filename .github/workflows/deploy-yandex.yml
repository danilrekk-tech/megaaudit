name: Deploy frontend to Yandex Object Storage

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build static frontend
        env:
          YANDEX_BUILD: "1"
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Configure Yandex S3 credentials
        run: |
          aws configure set aws_access_key_id "${{ secrets.YC_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.YC_SECRET_ACCESS_KEY }}"
          aws configure set region ru-central1

      - name: Upload hashed assets (long cache)
        run: |
          aws --endpoint-url=https://storage.yandexcloud.net \
            s3 sync .output/public "s3://${{ secrets.YC_BUCKET }}" \
            --delete --exclude "*.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload HTML (no cache)
        run: |
          aws --endpoint-url=https://storage.yandexcloud.net \
            s3 sync .output/public "s3://${{ secrets.YC_BUCKET }}" \
            --exclude "*" --include "*.html" \
            --cache-control "no-cache"
